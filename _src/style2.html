<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сонях">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Сонях — такси (демо)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
/*__CSS__*/
/* ===== Жёлтый стиль: по скринам пользователя (главная, выбор класса, поиск, поездка) ===== */
body{--y:#FFDD2D;--ink:#222326;--mute:#7c7f85;--bg:#F1F1F1;--line:#ececec;--red:#D0021B;--mint:#33D19B;--accent:#ffffff;--accent2:#222;--to-bg:#222326;color:var(--ink);font-size:17px;background:var(--bg)}
.base-tiles.vector{filter:none}
body:not(.st-form) .near-car{display:none}
.fit{display:none!important}
.menu::after{content:"";position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:#E5212B;border:1.5px solid #fff}
.pstrip{height:30px;margin:0;background:linear-gradient(90deg,#26B4D7,#36CF8C);border-radius:14px 14px 0 0;text-align:center;font-size:14px;line-height:28px;color:#1d2a2a}
.gwhite{background:#fff;border-radius:14px 14px 0 0;margin-top:-6px;padding-top:1px}
#formSheet{background:var(--bg);border-radius:14px 14px 0 0}
#formSheet .grab{background:transparent}
.leaflet-container{background:#ededed}

/* кнопки на карте */
.sq{position:fixed;z-index:15;width:42px;height:42px;border-radius:10px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14);display:grid;place-items:center}
.menu{left:6px;top:calc(env(safe-area-inset-top) + 8px)}
.back,.down{left:6px;top:calc(env(safe-area-inset-top) + 8px);display:none}
.bonus{position:fixed;z-index:15;right:6px;top:calc(env(safe-area-inset-top) + 12px);height:31px;padding:0 6px 0 11px;border-radius:9px;background:linear-gradient(90deg,#FF6E1A,#FFB01E);color:#fff;display:flex;align-items:center;gap:6px;font-weight:600;font-size:17px}
.mapbtn{width:42px;height:42px;border-radius:10px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14);display:grid;place-items:center;right:6px}
.locate{bottom:calc(var(--sheet,280px) + 14px)}
.fit{bottom:calc(var(--sheet,280px) + 64px)}
.shield{bottom:calc(var(--sheet,280px) + 14px);display:none}
.task{position:fixed;z-index:15;right:16px;top:calc(env(safe-area-inset-top) + 10px);width:84px;padding:6px 10px 8px;border-radius:10px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14);display:none;text-align:center;font-weight:700;font-size:19px}
.task i{display:block;height:7px;border-radius:4px;margin-top:3px;background:linear-gradient(90deg,#9ee6d3 0 55%,#2fb894 55% 60%,#e3e3e3 60%)}
/* видимость по экранам */
body:not(.st-form) .menu,body:not(.st-form) .bonus,body:not(.st-form) .locate,body:not(.st-form) .fit{display:none}
body.st-order .back{display:grid}
body.st-search .down,body.st-ride .down{display:grid}
body.st-search .shield,body.st-ride .shield{display:grid}
body.st-ride .task{display:block}
.leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top) + 50px)}
body.st-ride .leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top) + 64px)}
/* карта в рамке на экране поездки */
body.st-ride #map{top:calc(env(safe-area-inset-top) + 2px);left:8px;right:8px;border-radius:16px;border:1px solid #dcdcdc;overflow:hidden}
body.st-ride .down{left:16px;top:calc(env(safe-area-inset-top) + 10px)}
body.st-ride .shield{right:16px}

/* панели */
.sheet{background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.08)}
.handle{width:24px;height:4px;background:#d2d2d2;margin:6px auto 6px}
.sbody{padding:0 0 10px}

/* ----- главная ----- */
#formSheet{background:var(--bg)}
#formSheet .grab{background:#fff}
.card{background:#fff;padding:2px 12px 12px;border-radius:0 0 14px 14px;margin-bottom:8px}
.card+.card{border-radius:14px;padding:12px}
.frow{gap:6px;margin-bottom:6px;align-items:center}
.fdot{position:absolute;left:12px;top:13px;width:22px;height:22px;z-index:1;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;pointer-events:none}
.frow.stop .fdot{background:#555;border-radius:50%;width:20px;height:20px;left:13px;top:14px}
.fbox{background:#F0F0F0;border-radius:9px;height:48px;display:flex;align-items:center;padding:0 12px 0 44px}
.finput{font-size:17px;line-height:24px;height:24px;color:var(--ink)}
.hw{display:flex;align-items:center;background:#F0F0F0;border-radius:9px;height:48px;flex:none}
.hw button{width:52px;height:48px;display:grid;place-items:center}
.hw span{width:1px;height:24px;background:#cfcfd2}
.sb{background:#F0F0F0;border-radius:9px;width:30px;height:30px}
.sugg{background:#fff;border:1px solid #ececec;border-radius:10px;padding:0 10px}
.addstop{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);padding:2px 2px 4px}
.addstop i{width:22px;height:22px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-style:normal;font-size:17px;line-height:1}
.recent{display:flex;overflow-x:auto;padding:10px 0 2px;margin:0 -12px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px;font-size:16px;white-space:nowrap;border-right:1px solid #ddd}
.rc:last-child{border-right:0}
.trip{margin-top:8px;display:inline-block;background:#FFF5BF;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;height:52px;border-radius:10px;background:#F2F2F2;padding:7px 8px;text-align:left;font-size:14px;overflow:hidden;display:block}
.tile .em{position:absolute;right:4px;bottom:1px;font-size:22px;line-height:1}
.tile .beta{position:absolute;left:8px;bottom:6px;background:#3a3a3a;color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px}

/* пин «Откуда»: большой на главной и в поиске, точка — на выборе класса и в поездке */
.pin2{position:relative;width:36px;height:60px}
.pin2 .h{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--y);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pin2 .h i{width:6px;height:6px;border-radius:50%;background:#333;margin-left:-14px}
.pin2 .l{position:absolute;left:17px;top:34px;width:2.5px;height:22px;background:var(--y)}
.pin2 .b{position:absolute;left:11px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:rgba(255,221,45,.55);display:grid;place-items:center}
.pin2 .b::after{content:"";width:4px;height:4px;border-radius:50%;background:#555}
.pin2 .d{display:none;position:absolute;left:8px;bottom:-10px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#222 0 3px,var(--y) 3.6px);box-shadow:0 0 0 6px rgba(120,170,255,.18)}
body.st-order .pin2 .h,body.st-order .pin2 .l,body.st-order .pin2 .b,
body.st-ride .pin2 .h,body.st-ride .pin2 .l,body.st-ride .pin2 .b{display:none}
body.st-order .pin2 .d,body.st-ride .pin2 .d{display:block}
.mk-num{width:22px;height:22px;font-size:11px;background:#222;border:2px solid #fff}
.apill{display:none}
body.st-order .apill{display:flex}
.apill.from{transform:translate(-30%,14px)}
.apill.to{transform:translate(-60%,-60px)}
.ebub{transform:translate(-50%,-118%);width:48px;height:48px;border-radius:50%;background:rgba(255,221,45,.78);display:grid;place-content:center;text-align:center;font-size:19px;font-weight:500;color:#555;line-height:1}
.ebub small{display:block;font-size:11px;margin-top:2px}
body.st-search #searchSheet{display:flex}

/* ----- выбор класса ----- */
.chips{position:fixed;left:0;right:0;z-index:16;bottom:calc(var(--sheet,280px) + 10px);display:none;gap:8px;padding:0 8px;overflow-x:auto;scrollbar-width:none;transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
.chips::-webkit-scrollbar{display:none}
body.dragging .chips{transition:none}
body.st-order:not(.sheet-full) .chips{display:flex}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:10px;background:#fff;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#orderSheet .sbody{padding:0 8px}
.clsr{display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:8px 14px 8px 8px;border-radius:10px;border:1.5px solid transparent;text-align:left;margin-bottom:2px}
.clsr.on{border-color:#F2C230}
.clsr .cimg{width:58px;flex:none;display:grid;place-items:center;position:relative;height:28px}
.clsr .cimg svg{position:absolute}
.clsr .cn{flex:1;min-width:0}
.clsr b{display:block;font-weight:400;font-size:17px}
.clsr small{display:flex;align-items:center;gap:4px;color:var(--mute);font-size:14px;margin-top:3px}
.clsr .cp{font-size:16px}
.promo{margin:6px 0 4px;background:#FCEB8F;border-radius:12px;padding:9px 12px;font-size:15px;display:flex;align-items:center;gap:6px}
#orderSheet .sfoot{padding:8px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.payrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cash{display:flex;align-items:center;gap:8px;font-size:16px}
.gbtn{height:42px;padding:0 20px;border-radius:10px;background:#F1F1F1;font-size:16px}
.order{width:100%;height:54px;border-radius:12px;background:var(--y);font-size:21px;font-weight:500;display:flex;align-items:center}
.order span:first-child{flex:1;text-align:center;padding-left:52px}
.order .cal{width:56px;height:30px;border-left:1.5px solid rgba(0,0,0,.18);display:grid;place-items:center}
#priceEdit{display:flex;gap:8px;margin-bottom:8px}
#priceEdit.hidden{display:none}
.pricefield{flex:1;display:flex;align-items:center;gap:6px;background:#F1F1F1;border-radius:10px;padding:0 14px;height:44px}
.pricefield input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:18px;font-weight:600}
.pricefield span{color:var(--mute)}

/* ----- поиск ----- */
#searchSheet,#rideSheet{background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.08)}
#searchSheet .sbody,#rideSheet .sbody{padding-top:0!important}
#searchSheet .sbody,#rideSheet .sbody{padding:0 8px calc(10px + env(safe-area-inset-bottom))}
.wcard{background:#fff;border-radius:16px;margin:0 8px 8px}
.sbody .wcard{margin:0 0 8px}
.scard{padding:6px 0 0;text-align:center}
.scard .js-steps{margin:14px 0 18px}
.stage{font-size:18px;font-weight:600}
.stsub{font-size:15px;color:var(--mute);margin:6px 0 16px}
.prow{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:16px 32px 6px}
.pbtn{width:72px;height:44px;border-radius:10px;background:#F1F1F1;font-size:15px}
.pbig{font-size:30px;font-weight:700;letter-spacing:-.5px}
.hint{font-size:15px;color:var(--mute);padding:14px 16px 20px}
.searchat{display:none;margin:10px 16px 16px;width:calc(100% - 32px);height:46px;border-radius:10px;background:var(--y);font-size:16px}
#searchSheet.price-changed .hint{display:none}
#searchSheet.price-changed .searchat{display:block}
.redbtn{width:100%;height:62px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--red);font-size:17px}
.sharebtn{width:100%;height:62px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:17px}
.h2{font-size:17px;font-weight:600;margin:18px 16px 10px}
.routecard{padding:4px 16px 4px 16px}
.rl{display:flex;gap:16px;align-items:center;position:relative;padding:10px 0}
.rl+.rl .rx{border-top:1px solid var(--line);padding-top:10px}
.rl+.rl{padding-top:0}
.rl .rd{width:20px;height:20px;flex:none;border-radius:50%;font-style:normal;font-size:10px;font-weight:700;color:#fff;display:grid;place-items:center;background:#555}
.rl.from .rd{background:radial-gradient(circle,#222 0 3px,var(--y) 3.6px)}
.rl.to .rd{background:radial-gradient(circle,#fff 0 3px,#222 3.6px)}
.rl:not(:last-child)::after{content:"";position:absolute;left:9px;top:34px;bottom:-14px;border-left:2px dotted #c9c9c9}
.rx{flex:1;min-width:0}
.rx small{display:block;color:var(--mute);font-size:14px}
.rx span{display:block;font-size:17px;margin-top:1px}
.paycard{display:flex;align-items:center;gap:14px;padding:12px 16px}
.paycard .pv{flex:1}
.paycard .pv small{display:block;color:var(--mute);font-size:16px}
.paycard input{border:0;outline:0;background:transparent;font-size:17px;width:3.4em;padding:0}
.taskcard{padding:14px 16px}
.taskcard .tt{display:flex;gap:14px;align-items:flex-start}
.taskcard b{display:block;font-weight:400;font-size:17px}
.taskcard small{display:block;color:var(--mute);font-size:15px;margin-top:2px}
.taskcard .bar{height:8px;border-radius:4px;background:#e9e9e9;margin-top:14px}
#dim{position:fixed;inset:0;z-index:18;background:rgba(36,39,46,.92);display:none}
#dim button{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 12px);height:40px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-size:16px}
body.st-search.sheet-full #dim{display:block}

/* ----- поездка ----- */
.arr{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 14px}
.arr b{font-weight:500;font-size:19px}
.etapill{background:#F1F1F1;border-radius:10px;padding:7px 14px;font-size:19px;font-weight:600}
.carcard{padding:16px 0 0 16px;overflow:hidden}
.carrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bigplate{font-size:22px;font-weight:700;letter-spacing:.2px}
.carsub{color:var(--mute);font-size:14px;margin-top:5px}
.carpic{flex:none;width:96px;height:44px;position:relative}
.carpic svg{position:absolute;left:0;top:0}
.drv{display:flex;align-items:center;gap:14px;margin:14px 16px 0 0;padding:14px 0 16px;border-top:1px solid var(--line)}
.ava{position:relative;width:46px;height:46px;flex:none}
.ava .js-ava{display:block;width:44px;height:44px;border-radius:50%;overflow:hidden;border:1px solid #ddd}
.ava .js-ava svg{width:100%;height:100%;display:block}
.ava .rb{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#fff;border:1px solid #d9d9d9;border-radius:7px;font-size:12px;padding:0 4px;white-space:nowrap}
.dn{flex:1;min-width:0;padding-left:8px}
.dn b{display:block;font-weight:500;font-size:17px}
.dn small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.cc{width:44px;height:44px;border-radius:10px;background:#F1F1F1;display:grid;place-items:center;flex:none}
#miniBar{position:fixed;z-index:19;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 2px);height:62px;border-radius:16px;background:#fff;border:1px solid #dcdcdc;display:none;align-items:center;gap:12px;padding:0 14px 0 8px}
body.st-ride.sheet-full #miniBar{display:flex}
#miniBar .sqb{width:42px;height:42px;border-radius:10px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14);display:grid;place-items:center;flex:none}
.track{position:relative;flex:1;height:30px}
.track::before{content:"";position:absolute;left:0;right:10px;top:13px;height:4px;border-radius:2px;background:#e2e2e2}
.track .done{position:absolute;left:0;top:13px;height:4px;border-radius:2px;background:#222;width:calc(var(--prog,0) * (100% - 20px))}
.track .tcar{position:absolute;display:block;top:50%;left:calc(var(--prog,0) * (100% - 34px));width:14px;height:28px;transform:translate(7px,-50%) rotate(90deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.track .tcar svg{display:block}
.track .tend{position:absolute;right:0;top:5px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#222 0 3px,var(--y) 3.6px)}
body.arrived .etapill{background:#E5F7EF}
</style>
</head>
<body>
<div id="map"></div>

<button class="sq menu js-menu" aria-label="Меню"><svg width="20" height="14" viewBox="0 0 20 14"><path d="M1 1h18M1 7h18M1 13h18" stroke="#333" stroke-width="2" stroke-linecap="round"/></svg></button>
<button class="sq back js-back" aria-label="Назад"><svg width="20" height="16" viewBox="0 0 20 16"><path d="M19 8H2M8 1 1 8l7 7" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="sq down js-collapse" aria-label="Свернуть"><svg width="16" height="10" viewBox="0 0 16 10"><path d="M1.5 1.5 8 8l6.5-6.5" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div class="bonus">680<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="#FFD43A"/><circle cx="11" cy="11" r="7.4" fill="#FFB800"/><path d="M8.3 8.2c1.4-1 4.1-.7 4.5 1.1.3 1.6-2.4 2-2.4 3.8" fill="none" stroke="#FFE680" stroke-width="1.7" stroke-linecap="round"/></svg></div>
<div class="task">+40 <svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align:-1px"><circle cx="8" cy="8" r="7.5" fill="#FFC41F"/><circle cx="8" cy="8" r="5" fill="#FFD84F"/></svg><i></i></div>
<button class="mapbtn fit js-fit" aria-label="Весь маршрут"><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="#333" stroke-width="2"><circle cx="5" cy="5" r="3"/><circle cx="17" cy="17" r="3"/><path d="M7.2 7.2l7.6 7.6" stroke-linecap="round"/></svg></button>
<button class="mapbtn locate js-locate" aria-label="Моё местоположение"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#333" stroke-width="2"><circle cx="11" cy="11" r="6"/><circle cx="11" cy="11" r="2.4" fill="#333"/><path d="M11 1v3.5M11 17.5V21M1 11h3.5M17.5 11H21" stroke-linecap="round"/></svg></button>
<button class="mapbtn shield js-fit" aria-label="Безопасность"><svg width="14" height="20" viewBox="0 0 14 20" fill="none" stroke="#333" stroke-width="1.6"><path d="M7 1 13 3.5V9c0 4.6-2.6 8.3-6 10C3.6 17.3 1 13.6 1 9V3.5Z"/><path d="M7 1v18" /></svg></button>
<div class="chips"><button class="js-deco">Комментарий</button><button class="js-deco">Еду я</button><button class="js-deco">Дополнительные услуги</button></div>
<div id="dim"><button class="js-collapse">Скрыть детали</button></div>
<div id="miniBar"><button class="sqb js-expand" aria-label="Развернуть карту"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"><path d="M10.5 1.5h6v6M16.5 1.5l-6 6M7.5 16.5h-6v-6M1.5 16.5l6-6"/></svg></button><div class="track"><span class="done"></span><span class="tcar" data-car-top="#FFD21F" data-w="14" data-glass="#222"></span><span class="tend"></span></div></div>
<div id="searching"><span class="spin"></span>Ищем машину…</div>
<div id="toast" role="status"></div>

<!-- Главная: адреса -->
<section class="sheet" id="formSheet">
  <div class="grab"><div class="pstrip">У тебя есть промокод 🙂</div><div class="gwhite"><div class="handle"></div></div></div>
  <div class="sbody">
    <div class="card">
      <div id="fields"></div>
      <button class="addstop js-add-stop"><i>+</i>Добавить остановку</button>
      <div class="recent">
        <button class="rc" data-addr="Соляниковский переулок, 11, Харьков"><svg width="14" height="18" viewBox="0 0 20 26"><path d="M10 1a8.5 8.5 0 0 0-8.5 8.5C1.5 16 10 25 10 25s8.5-9 8.5-15.5A8.5 8.5 0 0 0 10 1z" fill="#555"/><circle cx="10" cy="9.5" r="3.2" fill="#fff"/></svg>Соляниковский переулок, 11</button>
