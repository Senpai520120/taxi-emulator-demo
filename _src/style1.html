<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Рух — такси (демо)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рух">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
/*__CSS__*/
body{--accent:#1DB954;--accent2:#1DB954;--to-bg:#1d1d1f;--stop-bg:#7a7a80}
.menu{position:fixed;left:20px;top:calc(env(safe-area-inset-top) + 14px);z-index:15;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.16);display:grid;place-items:center}
.bonus{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 22px);z-index:15;height:50px;padding:0 18px 0 12px;border-radius:25px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.16);display:flex;align-items:center;gap:8px;font-weight:600;font-size:21px}
.locate{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);display:grid;place-items:center}
.sheet{background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
.sbody{padding:0 20px 8px}

/* адреса */
.frow{gap:0 14px;padding:11px 0}
.fdot{width:24px;height:24px;flex:none;margin-top:3px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;position:relative;z-index:1}
.frow.from .fdot{background:radial-gradient(circle,#1DB954 0 4px,#fff 4.6px 7.4px,#1DB954 8px)}
.frow.to .fdot{background:radial-gradient(circle,#1d1d1f 0 4px,#fff 4.6px 7.4px,#1d1d1f 8px)}
.frow.stop .fdot{background:#8e8e93}
.frow:not(:last-child)::after{content:"";position:absolute;left:11px;top:44px;bottom:-11px;border-left:2.5px dotted #1DB954}
.finput{font-size:21px;line-height:30px;height:30px}
.frow.from .finput{font-weight:500}
.fsub{font-size:15px;color:#8e8e93;margin-top:3px}
.fsub span{color:#1DB954}
.star{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid #e3e3e6;display:grid;place-items:center;margin:-8px 0 -8px 8px;align-self:center}
.base-tiles{filter:saturate(.45) brightness(1.06) contrast(.92)}
.sugg{flex:0 0 calc(100% - 38px);margin:6px 0 0 38px;background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:0 10px}
.addstop{display:flex;align-items:center;gap:14px;color:#1DB954;font-size:17px;font-weight:500;padding:6px 0 14px}
.addstop i{width:24px;height:24px;border-radius:50%;border:2px solid #1DB954;display:grid;place-items:center;font-style:normal;font-size:18px;line-height:1}
.trip{margin:0 0 14px 38px;display:inline-block;background:#EAF8EF;color:#13813b;border-radius:10px;padding:7px 12px;font-size:15px;font-weight:600}
.block{border-top:1px solid #efeff1;padding:14px 0}
.lbl{font-size:14px;color:#8e8e93;margin-bottom:8px}
.pricefield{display:flex;align-items:center;gap:6px;background:#F4F4F5;border-radius:14px;padding:0 16px;height:56px}
.pricefield input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:21px;font-weight:600}
.pricefield span{font-size:21px;color:#8e8e93}
.clsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls{background:#F4F4F5;border-radius:16px;padding:10px 10px 9px;text-align:left;border:2px solid transparent;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.cls.on{border-color:#1DB954;background:#fff}
.cls b{font-size:16px;font-weight:600}
.cls small{font-size:12px;color:#8e8e93}
.cls .cpic{height:28px;width:40px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.cls .cpic svg{transform:rotate(90deg)}

/* низ формы */
.sfoot{display:flex;align-items:center;gap:8px;border-top:1px solid #efeff1;padding:14px 0 calc(14px + env(safe-area-inset-bottom)) 20px}
.clsbtn{display:flex;align-items:center;gap:14px;text-align:left;flex:1 1 auto;min-width:0}
.clsbtn .cv{flex:none}
.clsbtn .ct{min-width:0}
.clsbtn b{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:500;white-space:nowrap}
.clsbtn small{display:block;color:#8e8e93;font-size:15px;white-space:nowrap}
.fprice{display:flex;align-items:baseline;gap:2px;flex:none;font-weight:700;font-size:23px}
.fprice input{width:76px;text-align:right;border:0;outline:0;background:transparent;font-weight:700;font-size:23px;padding:2px 0;border-bottom:2px dashed #dadade}
.go{width:92px;height:72px;flex:none;border-radius:36px 0 0 36px;background:#FFD21F;display:grid;place-items:center}

/* карточка поездки */
.eta{padding:0 20px 12px}
.eta-t{font-size:22px;font-weight:700;line-height:1.25}
.eta-t span{color:#1DB954}
.eta-s{color:#8e8e93;font-size:16px;margin-top:4px}
.carrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #efeff1}
.car-n{font-size:20px;font-weight:600;margin-top:10px}
.car-c{color:#8e8e93;font-size:15px;margin-top:2px}
.car-pic{width:90px;height:56px;display:grid;place-items:center;flex:none}
.drv{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #efeff1}
.ava{width:50px;height:50px;border-radius:50%;background:#EAF8EF;color:#13813b;display:grid;place-items:center;font-weight:700;font-size:21px;flex:none}
.drv b{display:block;font-size:18px;font-weight:600}
.drv .rate{color:#8e8e93;font-size:15px}
.drv .rate i{color:#f5b800;font-style:normal}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0 14px}
.act{height:52px;border-radius:16px;background:#F4F4F5;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600}
.sec{border-top:1px solid #efeff1;padding:14px 0}
.sec-h{font-size:14px;color:#8e8e93;margin-bottom:8px}
.rr{display:flex;gap:14px;align-items:flex-start;padding:6px 0;position:relative;font-size:17px}
.rr:not(:last-child)::after{content:"";position:absolute;left:8px;top:28px;bottom:-8px;border-left:2px dotted #1DB954}
.rdot{width:18px;height:18px;flex:none;margin-top:2px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#8e8e93}
.rr.from .rdot{background:radial-gradient(circle,#1DB954 0 3px,#fff 3.6px 5.4px,#1DB954 6px)}
.rr.to .rdot{background:radial-gradient(circle,#1d1d1f 0 3px,#fff 3.6px 5.4px,#1d1d1f 6px)}
.rt{min-width:0;overflow-wrap:anywhere}
.trip2{margin-top:8px;font-weight:600;font-size:16px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.prow .pricefield{width:150px;height:52px}
#rideSheet .sfoot{padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.cancel{width:100%;height:56px;border-radius:16px;background:#F4F4F5;color:#e5383b;font-weight:600;font-size:18px}

/* пин «Откуда» */
.pin1{position:relative;width:46px;height:70px}
.pin1 .h{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:#1DB954;box-shadow:0 3px 8px rgba(0,0,0,.25);display:grid;place-items:center}
.pin1 .h i{width:16px;height:16px;border-radius:50%;background:#fff}
.pin1 .l{position:absolute;left:21.5px;top:44px;width:3px;height:26px;background:#1DB954;border-radius:2px}

/* v2: детали как в реальном приложении */
body{--to-bg:#fff;--to-fg:#1d1d1f;--stop-bg:#fff}
.mk-num{color:#1d1d1f;border:4px solid #1d1d1f;width:26px;height:26px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mk-num.to{font-size:0}
.base-tiles.vector{filter:saturate(.8) brightness(1.02)}
.mapbtn.fit{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18);display:grid;place-items:center;bottom:calc(var(--sheet,280px) + 90px)}
.dbub{transform:translate(-50%,-150%);background:#fff;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;color:#1d1d1f;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.dbub small{font-weight:400;color:#8e8e93;font-size:14px}
.ebub{transform:translate(-50%,-112px);background:#1d1d1f;color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:700}
.eta-t .js-countdown{display:inline-block;margin-left:6px;background:#EAF8EF;color:#13813b;border-radius:8px;padding:2px 8px;font-size:17px;font-variant-numeric:tabular-nums;vertical-align:2px}
.ava{position:relative}
.ava .rb{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:11px;font-weight:700;color:#1d1d1f;padding:1px 5px;white-space:nowrap}
.fsub{display:block}
.frow.stop .fsub span,.frow.to .fsub span{color:#8e8e93}

</style>
</head>
<body>
<div id="map"></div>

<button class="menu js-menu" aria-label="Меню"><svg width="30" height="22" viewBox="0 0 30 22"><path d="M2 2h26M2 11h26M2 20h18" stroke="#1d1d1f" stroke-width="2.6" stroke-linecap="round"/></svg></button>
<div class="bonus"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#F5B800"/><circle cx="14" cy="14" r="10" fill="#FFCE2E"/><path d="M14 7.5l1.9 4.1 4.4.4-3.3 2.9 1 4.4L14 17l-4 2.3 1-4.4-3.3-2.9 4.4-.4z" fill="#fff"/></svg>64</div>
<button class="locate mapbtn js-locate" aria-label="Моё местоположение"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#1d1d1f" stroke-width="2.4"><circle cx="17" cy="17" r="9"/><circle cx="17" cy="17" r="3.6" fill="#1d1d1f"/><path d="M17 2v6M17 26v6M2 17h6M26 17h6" stroke-linecap="round"/></svg></button>
<button class="mapbtn fit js-fit" aria-label="Показать весь маршрут"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="20" r="3"/><circle cx="20" cy="6" r="3"/><path d="M8.5 18 17.5 8"/></svg></button>
<div id="searching"><span class="spin"></span>Ищем машину…</div>
<div id="toast" role="status"></div>

<!-- Панель заказа -->
<section class="sheet" id="formSheet">
  <div class="grab"><div class="handle"></div></div>
  <div class="sbody">
    <div id="fields"></div>
    <button class="addstop js-add-stop"><i>+</i>Добавить остановку</button>
    <div><div class="trip js-trip hidden"></div></div>
    <div class="block">
      <div class="lbl">Стоимость, ₴</div>
      <label class="pricefield"><input class="js-price" type="text" inputmode="decimal" placeholder="Введите сумму" autocomplete="off"><span>₴</span></label>
    </div>
    <div class="block" id="classes">
      <div class="lbl">Класс авто</div>
      <div class="clsrow">
        <button class="cls js-cls" data-c="economy"><span class="cpic"><svg width="20" height="36" viewBox="0 0 24 44"><use href="#carY"/></svg></span><b>Эконом</b><small>1-4 пассажира</small></button>
        <button class="cls js-cls" data-c="standard"><span class="cpic"><svg width="20" height="36" viewBox="0 0 24 44"><use href="#carY"/></svg></span><b>Стандарт</b><small>1-4 пассажира</small></button>
        <button class="cls js-cls" data-c="comfort"><span class="cpic"><svg width="20" height="36" viewBox="0 0 24 44"><use href="#carK"/></svg></span><b>Комфорт</b><small>1-4 пассажира</small></button>
      </div>
    </div>
  </div>
  <div class="sfoot">
    <button class="clsbtn js-cls-open">
      <svg class="cv" width="24" height="44" viewBox="0 0 24 44"><use href="#carY"/></svg>
      <span class="ct"><b><span class="js-cls-name">Стандарт</span><svg width="14" height="9" viewBox="0 0 14 9"><path d="M1.5 1.5 7 7l5.5-5.5" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/></svg></b><small>1-4 пассажира</small></span>
    </button>
    <label class="fprice"><input class="js-price" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Стоимость, ₴">₴</label>
    <button class="go js-find" aria-label="Найти машину" title="Найти машину"><svg width="30" height="26" viewBox="0 0 30 26"><path d="M2 13h24M15 2l11 11-11 11" fill="none" stroke="#1d1d1f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>

<!-- Карточка поездки -->
<section class="sheet off" id="rideSheet">
  <div class="grab">
    <div class="handle"></div>
    <div class="eta">
      <div class="eta-t"><span class="js-arrive-title" data-t="Машина будет через" style="color:inherit">Машина будет через</span> <span id="rcEta"></span><span class="js-countdown">00:00</span></div>
      <div class="eta-s"><span id="rcDist"></span> до вас · подача в <span class="js-eta-clock"></span></div>
    </div>
  </div>
  <div class="sbody">
    <div class="carrow">
      <div><div class="plate" id="rcPlate"></div><div class="car-n" id="rcModel"></div><div class="car-c"><span id="rcColor"></span> · <span class="js-cls-name"></span></div></div>
      <div class="car-pic" id="rcCarPic"></div>
    </div>
    <div class="drv"><div class="ava"><span id="rcAva"></span><span class="rb">★ <span id="rcRating"></span></span></div><div><b id="rcDriver"></b><span class="rate"><span class="js-trips"></span></span></div></div>
    <div class="acts">
      <button class="act js-call"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#1DB954"/></svg>Позвонить</button>
      <button class="act js-msg"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 1-2z" fill="#1DB954"/></svg>Сообщение</button>
    </div>
    <div class="sec"><div class="sec-h">Маршрут поездки</div><div id="rcRoute"></div><div class="trip2" id="rcTrip"></div></div>
    <div class="sec prow"><div><div class="sec-h" style="margin:0">Стоимость</div><small style="color:#8e8e93">можно изменить</small></div><label class="pricefield"><input class="js-price" type="text" inputmode="decimal" placeholder="0" autocomplete="off"><span>₴</span></label></div>
  </div>
  <div class="sfoot"><button class="cancel js-cancel">Отменить</button></div>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="carY"><rect x="1.5" y="1.5" width="21" height="41" rx="7" fill="#FFC928" stroke="#c99500"/><path d="M4.3 13.6Q12 9.6 19.7 13.6L18.6 18.4H5.4Z" fill="#26313d"/><path d="M5.4 33H18.6L19.2 37.3Q12 39.8 4.8 37.3Z" fill="#26313d"/><rect x="5.6" y="19.2" width="12.8" height="12.8" rx="2.5" fill="#FFD84F"/></g>
    <g id="carK"><rect x="1.5" y="1.5" width="21" height="41" rx="7" fill="#2b2d33" stroke="#000"/><path d="M4.3 13.6Q12 9.6 19.7 13.6L18.6 18.4H5.4Z" fill="#9fb3c8"/><path d="M5.4 33H18.6L19.2 37.3Q12 39.8 4.8 37.3Z" fill="#9fb3c8"/><rect x="5.6" y="19.2" width="12.8" height="12.8" rx="2.5" fill="#3a3d45"/></g>
  </defs>
</svg>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
window.APP = {
  vectorStyle: 'https://tiles.openfreemap.org/styles/liberty',
  taxiColor: '#FFC928',
  destBubble: (km, min) => `<div class="bubble"><div class="dbub">${km} <small>• ${min} мин</small></div></div>`,
  etaBubble: min => `<div class="bubble"><div class="ebub">${min} мин</div></div>`,
  name: 'Рух',
  tiles: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  fallbackTiles: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  attr: '© OpenStreetMap',
  ph: { from: 'Откуда', to: 'Куда...', stop: 'Остановка' },
  showSub: true,
  toExtra: '<button class="star js-deco" aria-label="Избранное"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17l-5.7 3.1 1.2-6.3L2.9 9.4l6.3-.8z" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linejoin="round"/></svg></button>',
  pin: { html: '<div class="pin1"><div class="h"><i></i></div><div class="l"></div></div>', size: [46, 70], anchor: [23, 70] },
  route: { color: '#1DB954', casing: '#ffffff' },
  carRoute: '#1d1d1f',
  formSnaps: (H, top) => { const lo = Math.min(300, H * 0.45); return [lo, Math.max(lo + 80, H * 0.58), H - top - 64]; },
  rideSnaps: (H, top) => { const lo = Math.min(200, H * 0.3); return [lo, Math.max(lo + 80, H * 0.56), H - top - 64]; }
};
/*__JS__*/
</script>
</body>
</html>
