<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рух">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Рух — такси (демо)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<style>
/*__CSS__*/
/* ===== Зелёный стиль: по скринам пользователя (главная, подача авто, «Ваша поездка») ===== */
body{--g:#12924A;--g2:#1A9A50;--ink:#1f2a30;--mute:#7d8a92;--line:#e7eaec;--accent:#12924A;--accent2:#12924A;color:var(--ink);font-size:17px}
.base-tiles.vector{filter:none}
#formSheet .trip{display:none}
.leaflet-container{background:#e9ebee}

/* кнопки на карте */
.mbtn{position:fixed;z-index:15;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center}
.menu{left:12px;top:calc(env(safe-area-inset-top) + 50px)}
.more{right:12px;top:calc(env(safe-area-inset-top) + 50px);display:none}
.bonus{position:fixed;z-index:15;right:9px;top:calc(env(safe-area-inset-top) + 55px);height:31px;padding:0 11px 0 6px;border-radius:16px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.16);display:flex;align-items:center;gap:5px;font-weight:600;font-size:16px}
.mapbtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center;right:16px}
.locate{bottom:calc(var(--sheet,280px) + 18px)}
.fit{bottom:calc(var(--sheet,280px) + 74px)}
.taxi-btn{bottom:calc(var(--sheet,280px) + 74px);display:none}
body.st-ride .more,body.st-ride .taxi-btn{display:grid}
body.st-ride .bonus,body.st-ride .locate{display:none}
body.st-ride .fit{bottom:calc(var(--sheet,280px) + 18px)}
.leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top) + 92px)}

/* панели */
.sheet{background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 16px rgba(0,0,0,.1)}
.handle{width:24px;height:4px;background:#c9cfd3;margin:7px auto 4px}
.sbody{padding:0 16px 10px}

/* адреса */
#fields{padding-top:4px}
.frow{gap:0 12px;padding:9px 0;align-items:flex-start}
.fdot{width:20px;height:20px;flex:none;margin-top:3px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;position:relative;z-index:1}
.frow.from .fdot{background:radial-gradient(circle,#fff 0 3.6px,var(--g2) 4.2px)}
.frow.to .fdot{background:radial-gradient(circle,#fff 0 3.6px,var(--ink) 4.2px)}
.frow.stop .fdot{background:#8a979e}
.frow:not(:last-child)::after{content:"";position:absolute;left:9px;top:36px;bottom:-12px;border-left:2px dotted var(--g2)}
.ftext,.finput{font-size:17px;line-height:22px;color:var(--ink)}
.finput{height:24px}
.fsub{font-size:14px;color:var(--mute);margin-top:2px}
.fsub span{color:var(--g2)}
.starbtn{width:31px;height:31px;flex:none;border-radius:50%;border:1px solid #dde1e4;display:grid;place-items:center;align-self:center;margin-left:8px}
.frow.to .plusbtn{display:none}
.frow.to.has-ll .plusbtn{display:grid}
.frow.to.has-ll .starbtn{display:none}
.fprice .from{display:none;font-weight:600;margin-right:5px}
.fprice input::placeholder{color:var(--ink);opacity:1}
.fprice input:placeholder-shown{width:2.1em;text-align:left}
#classes{margin-top:56px}
.fprice:has(input:placeholder-shown) .from{display:inline}
.bonus{border:1.5px solid #f0d27a}
.plusbtn{width:31px;height:31px;flex:none;border-radius:50%;border:1px solid #dde1e4;display:grid;place-items:center;align-self:center;margin-left:8px}
.sugg{flex:0 0 calc(100% - 32px);margin:6px 0 0 32px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:0 10px}
.trip{margin:4px 0 10px 32px;display:inline-block;background:#E4F5EA;color:#117a3f;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}
.lbl{font-size:13px;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin:12px 0 4px}
.clsr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:10px;text-align:left}
.clsr.on{background:#DFF5E5}
.clsr.on b{color:var(--g)}
.clsr .cimg{width:22px;display:grid;place-items:center}
.clsr .cn{flex:1;min-width:0}
.clsr b{display:block;font-weight:500;font-size:17px}
.clsr small{display:block;color:var(--mute);font-size:14px}
.clsr .cp{font-weight:700;font-size:17px}
.pricefield{display:flex;align-items:center;gap:6px;background:#f2f4f5;border-radius:10px;padding:0 14px;height:48px}
.pricefield input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;font-weight:600}
.pricefield span{color:var(--mute)}

/* низ формы */
#formSheet .sfoot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:11px 0 calc(10px + env(safe-area-inset-bottom)) 16px}
.clsbtn{display:flex;align-items:center;gap:14px;text-align:left;flex:1 1 auto;min-width:0}
.clsbtn b{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:400;white-space:nowrap}
.clsbtn small{display:block;color:var(--mute);font-size:14px;white-space:nowrap;margin-top:1px}
.fprice{display:flex;align-items:baseline;flex:none;font-weight:600;font-size:19px}
.fprice input{width:58px;text-align:right;border:0;outline:0;background:transparent;font-weight:600;font-size:19px;padding:0}
.go{width:64px;height:54px;flex:none;border-radius:27px 0 0 27px;background:#FFCC29;display:grid;place-items:center}

/* пин «Откуда»: большой на главной, кольцо — когда построен маршрут */
.pin1{position:relative;width:40px;height:62px}
.pin1 .h{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--g2);box-shadow:0 2px 6px rgba(0,0,0,.25);display:grid;place-items:center}
.pin1 .h i{width:14px;height:14px;border-radius:50%;background:#fff}
.pin1 .l{position:absolute;left:18.5px;top:38px;width:3px;height:24px;background:var(--g2);border-radius:2px}
.pin1 .ring{display:none;position:absolute;left:4px;bottom:-16px;width:32px;height:32px;border-radius:50%;background:rgba(66,133,244,.18)}
.pin1 .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,#fff 0 4.5px,var(--g2) 5.2px);box-shadow:0 0 0 2px #fff}
body.has-route .pin1 .h,body.has-route .pin1 .l{display:none}
body.has-route .pin1 .ring{display:block}
.mk-num{width:22px;height:22px;font-size:11px;background:#1f2a30;border:2px solid #fff}
.dbub{transform:translate(-50%,-160%);background:#fff;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.2);white-space:nowrap}
.dbub small{font-weight:400;color:var(--mute);font-size:13px}

/* ===== подача авто / ваша поездка ===== */
#rideSheet .sbody{padding:0}
.rtitle{padding:6px 16px 10px;font-size:21px;font-weight:700;line-height:1.25}
body.arrived .eta-v{display:none}
.rwait{display:none;padding:0 16px 8px;color:var(--mute);font-size:15px}
.rwait b{color:var(--ink);font-variant-numeric:tabular-nums}
body.arrived .rwait{display:block}
.carblk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px 14px}
.plate{border:1.5px solid var(--ink);border-radius:4px;padding:3px 7px;font-size:15px;font-weight:600;letter-spacing:.3px;display:inline-block}
.carname{margin-top:12px;font-size:16px;font-weight:600}
.carpic{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f4f6f7,#dfe3e6);display:grid;place-items:center;overflow:hidden;flex:none}
.carpic svg{transform:translateX(8px) scale(1.15)}
.drv{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.ava{position:relative;width:56px;height:56px;flex:none}
.ava .js-ava{display:block;width:56px;height:56px;border-radius:50%;overflow:hidden}
.ava .js-ava svg{width:100%;height:100%;display:block}
.ava .on{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--g2);color:#fff;font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;border:1.5px solid #fff}
.dname{font-size:17px}
.dname i{font-style:normal;color:var(--g2);font-size:14px;margin-left:8px}
.dname i b{color:var(--ink);font-size:13px}
.dstat{font-size:13px;color:var(--mute);line-height:1.35}
.dstat b{font-weight:400;color:var(--ink)}
.chatrow{display:flex;gap:16px;align-items:center;padding:6px 16px 18px}
.chat{flex:1;height:56px;border-radius:28px;border:1.5px solid #e1e5e8;display:flex;align-items:center;justify-content:center;gap:14px;font-size:19px;font-weight:500}
.callg{width:56px;height:56px;border-radius:50%;background:var(--g2);display:grid;place-items:center;flex:none}
.band{background:#EEF2F5;color:var(--mute);font-size:13px;letter-spacing:1.6px;padding:8px 16px}
.js-route-list{padding:10px 16px 4px}
.rl{display:flex;gap:14px;position:relative;padding:8px 0 10px}
.rl .rd{width:20px;height:20px;flex:none;border-radius:50%;margin-top:1px;font-style:normal;font-size:10px;font-weight:700;color:#fff;display:grid;place-items:center;background:#8a979e}
.rl.from .rd{background:radial-gradient(circle,#fff 0 3.6px,var(--g2) 4.2px)}
.rl.to .rd{background:radial-gradient(circle,#fff 0 3.6px,var(--ink) 4.2px)}
.rl:not(:last-child)::after{content:"";position:absolute;left:9px;top:28px;bottom:-6px;border-left:2px dotted var(--g2)}
.rl small{display:none}
.rl span{display:block;font-size:17px}
.rl.from span,.rl.stop span{color:#8a979e}
.elink{color:var(--g2);font-size:14px;display:block;margin-top:1px}
.opts{border-top:1px solid var(--line);padding:4px 16px calc(12px + env(safe-area-inset-bottom))}
.opt{display:flex;align-items:center;gap:16px;padding:11px 0;width:100%;text-align:left;font-size:17px}
.opt .oi{width:24px;flex:none;display:grid;place-items:center}
.opt .ot{flex:1;min-width:0}
.opt .ot small{display:block;color:var(--g2);font-size:14px}
.opt.dim .ot{color:#8a979e}
.chip{border:1px solid #dfe3e6;border-radius:8px;padding:6px 10px;font-size:14px}
.opt .pricefield{width:110px;height:38px;background:transparent;padding:0}
.opt .pricefield input{text-align:right;font-weight:400;font-size:17px}
.opt.cancel{color:#D32F2F}
#rideHead{position:fixed;left:0;right:0;top:0;z-index:19;height:calc(env(safe-area-inset-top) + 64px);padding-top:env(safe-area-inset-top);background:#00A35A;color:#fff;display:none;align-items:center;justify-content:space-between;padding-left:12px;padding-right:12px}
#rideHead b{font-size:19px}
#rideHead button{width:40px;height:40px;display:grid;place-items:center}
body.st-ride.sheet-full #rideHead{display:flex}
#searching{top:calc(env(safe-area-inset-top) + 104px)}
</style>
</head>
<body>
<div id="map"></div>

<button class="mbtn menu js-menu" aria-label="Меню"><svg width="20" height="14" viewBox="0 0 20 14"><path d="M1 1h18M1 7h18M1 13h12" stroke="#1f2a30" stroke-width="2" stroke-linecap="round"/></svg></button>
<button class="mbtn more js-deco" aria-label="Ещё"><svg width="18" height="4" viewBox="0 0 18 4"><circle cx="2" cy="2" r="2" fill="#1f2a30"/><circle cx="9" cy="2" r="2" fill="#1f2a30"/><circle cx="16" cy="2" r="2" fill="#1f2a30"/></svg></button>
<div class="bonus"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10.5" fill="#F5A800"/><circle cx="11" cy="11" r="8" fill="#FFC41F"/><path d="M11 5.6l1.5 3.3 3.6.4-2.7 2.4.8 3.6L11 13.4l-3.2 1.9.8-3.6-2.7-2.4 3.6-.4z" fill="#fff"/></svg>64</div>
<button class="mapbtn taxi-btn js-fit" aria-label="Машина"><svg width="22" height="20" viewBox="0 0 22 20" fill="#1f2a30"><path d="M8 1h6l.6 2.4H7.4z"/><path d="M4.6 5h12.8l2.2 5.4c.9.4 1.4 1.2 1.4 2.2V17a1 1 0 0 1-1 1h-1.6a1 1 0 0 1-1-1v-1H4.6v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-4.4c0-1 .5-1.8 1.4-2.2zm1.2 1.8-1.4 3.6h13.2l-1.4-3.6zM4.6 12.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm12.8 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></button>
<button class="mapbtn fit js-fit" aria-label="Весь маршрут"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#1f2a30" stroke-width="2"><circle cx="5" cy="5" r="3"/><circle cx="17" cy="17" r="3"/><path d="M7.2 7.2l7.6 7.6" stroke-linecap="round"/></svg></button>
<button class="mapbtn locate js-locate" aria-label="Моё местоположение"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#1f2a30" stroke-width="2"><circle cx="11" cy="11" r="6"/><circle cx="11" cy="11" r="2.4" fill="#1f2a30"/><path d="M11 1v3.5M11 17.5V21M1 11h3.5M17.5 11H21" stroke-linecap="round"/></svg></button>
<div id="searching"><span class="spin"></span>Ищем машину…</div>
<div id="toast" role="status"></div>
<div id="rideHead"><button class="js-collapse" aria-label="Свернуть"><svg width="18" height="11" viewBox="0 0 18 11"><path d="M1.5 1.5 9 9l7.5-7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><b>Ваша поездка</b><button class="js-deco" aria-label="Ещё"><svg width="18" height="4" viewBox="0 0 18 4"><circle cx="2" cy="2" r="2" fill="#fff"/><circle cx="9" cy="2" r="2" fill="#fff"/><circle cx="16" cy="2" r="2" fill="#fff"/></svg></button></div>

<!-- Главная: адреса -->
<section class="sheet" id="formSheet">
  <div class="grab"><div class="handle"></div></div>
  <div class="sbody">
    <div id="fields"></div>
    <div><div class="trip js-trip hidden"></div></div>
    <div id="classes">
      <div class="lbl">Класс авто</div>
      <div id="clsList"></div>
      <div class="lbl">Своя стоимость, ₴</div>
      <label class="pricefield"><input class="js-price" type="text" inputmode="decimal" autocomplete="off"><span>₴</span></label>
    </div>
  </div>
  <div class="sfoot">
    <button class="clsbtn js-cls-open">
      <span data-car-top="#FFC928" data-w="22"></span>
      <span><b><span class="js-cls-name">Стандарт</span><svg width="13" height="8" viewBox="0 0 13 8"><path d="M1.2 1.2 6.5 6.5l5.3-5.3" fill="none" stroke="#1f2a30" stroke-width="1.8" stroke-linecap="round"/></svg></b><small>1-4 пассажира</small></span>
    </button>
    <label class="fprice"><span class="from">от</span><input class="js-price" type="text" inputmode="decimal" autocomplete="off" aria-label="Стоимость, ₴">₴</label>
    <button class="go js-find" aria-label="Найти машину"><svg width="20" height="18" viewBox="0 0 20 18"><path d="M1.5 9h16M10.5 2l7 7-7 7" fill="none" stroke="#1f2a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>

<!-- Подача авто / Ваша поездка -->
<section class="sheet off" id="rideSheet">
  <div class="grab">
    <div class="handle"></div>
    <div class="rtitle"><span class="js-arrive-title" data-t="Подача авто через ~" data-arrived="Машина подана! Выходите">Подача авто через ~</span><span class="eta-v js-eta-min"></span></div>
    <div class="rwait">Бесплатное ожидание: <b class="js-wait">03:00</b></div>
  </div>
  <div class="sbody">
    <div class="carblk">
      <div><span class="plate js-plate"></span><div class="carname js-car-full"></div></div>
      <div class="carpic js-car-side" data-w="92"></div>
    </div>
    <div class="drv">
      <div class="ava"><span class="js-ava"></span><span class="on">Онлайн</span></div>
      <div>
        <div class="dname"><span class="js-driver"></span><i>★ <b class="js-rating"></b></i></div>
        <div class="dstat">Поездок: <b class="js-trips-n"></b></div>
        <div class="dstat">В сервисе: <b class="js-years"></b></div>
      </div>
    </div>
    <div class="chatrow">
      <button class="chat js-msg"><svg width="24" height="22" viewBox="0 0 24 22" fill="none" stroke="#1f2a30" stroke-width="2"><path d="M3 2h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-5 4V3a1 1 0 0 1 1-1z" stroke-linejoin="round"/></svg>Чат с водителем</button>
      <button class="callg js-call" aria-label="Позвонить"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="none" stroke="#fff" stroke-width="2"/></svg></button>
    </div>
    <div class="band">ПАРАМЕТРЫ ЗАКАЗА</div>
    <div class="js-route-list"></div>
    <div class="opts">
      <div class="opt"><span class="oi"><svg width="22" height="20" viewBox="0 0 22 20" fill="none" stroke="#9aa6ad" stroke-width="1.8"><path d="M2 2h18v12H8l-6 4z" stroke-linejoin="round"/><circle cx="7" cy="8" r=".6" fill="#9aa6ad"/><circle cx="11" cy="8" r=".6" fill="#9aa6ad"/><circle cx="15" cy="8" r=".6" fill="#9aa6ad"/></svg></span><span class="ot">Комментарий<small>Изменить</small></span><button class="chip js-deco">Подъезд</button></div>
      <div class="opt"><span class="oi"><svg width="20" height="18" viewBox="0 0 20 18" stroke="#9aa6ad" stroke-width="1.8" stroke-linecap="round"><path d="M1 3h18M1 9h18M1 15h18"/><path d="M6 1v4M14 7v4M8 13v4"/></svg></span><span class="ot">Дополнительные опции<small>Изменить</small></span></div>
      <div class="opt dim"><span class="oi"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#9aa6ad" stroke-width="1.8"><circle cx="11" cy="11" r="9.5"/><path d="M11 5v6l4 2.5" stroke-linecap="round"/></svg></span><span class="ot">На ближайшее время</span></div>
      <div class="opt dim"><span class="oi"><svg width="22" height="18" viewBox="0 0 22 18" fill="#9aa6ad"><path d="M4.6 2h12.8l2.2 5.4c.9.4 1.4 1.2 1.4 2.2V15a1 1 0 0 1-1 1h-1.6a1 1 0 0 1-1-1v-1H4.6v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V9.6c0-1 .5-1.8 1.4-2.2zm1.2 1.8L4.4 7.4h13.2l-1.4-3.6z"/></svg></span><span class="ot js-cls-name">Стандарт</span></div>
      <div class="opt"><span class="oi"><svg width="24" height="18" viewBox="0 0 24 18"><rect x="1" y="1" width="22" height="16" rx="1.5" fill="#1A9A50"/><rect x="3.5" y="3.5" width="17" height="11" fill="none" stroke="#c8f0d6" stroke-width="1"/><text x="12" y="12.2" text-anchor="middle" font-size="6.5" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">100</text></svg></span><span class="ot">Наличные</span><label class="pricefield"><input class="js-price" type="text" inputmode="decimal" autocomplete="off"><span>₴</span></label></div>
      <button class="opt js-share"><span class="oi"><svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#9aa6ad" stroke-width="1.8"><circle cx="16" cy="4" r="3"/><circle cx="4" cy="11" r="3"/><circle cx="16" cy="18" r="3"/><path d="m6.6 9.6 6.8-4.2M6.6 12.4l6.8 4.2"/></svg></span><span class="ot">Поделиться заказом</span></button>
